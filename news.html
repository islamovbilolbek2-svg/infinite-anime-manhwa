{% extends "base.html" %}
{% block title %}Yangiliklar — Infinite Anime/Manhwa{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap">
    <div class="section__head"><h1 class="section__title">Yangiliklar</h1></div>
    <div class="news-list">
      {% for n in items %}
      <div class="news-item">
        <div class="news-item__date">{{ n.created_at[:10] }}</div>
        <div>
          <div class="news-item__title">{{ n.title }}</div>
          {% if n.body %}<div class="news-item__desc">{{ n.body }}</div>{% endif %}
        </div>
      </div>
      {% else %}
      <p style="color:var(--graphite);">Hozircha yangilik yo'q.</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
